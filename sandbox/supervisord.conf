[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=bash -c "rm -f /tmp/.X1-lock && Xvfb :1 -screen 0 1280x1029x24"
autostart=true
autorestart=true
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb_err.log
environment=DISPLAY=:1
priority=10

[program:chrome]
command=bash -c "sleep 3 && \
    rm -rf /tmp/chrome-profile/SingletonLock /tmp/chrome-profile/SingletonCookie /tmp/chrome-profile/SingletonSocket && \
    chromium-browser \
    --window-size=1280,1029 \
    --start-maximized \
    --no-sandbox \
    --disable-dev-shm-usage \
    --disable-setuid-sandbox \
    --disable-accelerated-2d-canvas \
    --disable-gpu \
    --disable-software-rasterizer \
    --disable-features=WelcomeExperience,SigninPromo,VizDisplayCompositor \
    --no-first-run \
    --no-default-browser-check \
    --disable-infobars \
    --test-type \
    --disable-popup-blocking \
    --disable-gpu-sandbox \
    --no-xshm \
    --disable-notifications \
    --disable-extensions \
    --disable-component-extensions-with-background-pages \
    --disable-prompt-on-repost \
    --disable-dialogs \
    --disable-modal-dialogs \
    --disable-web-security \
    --disable-site-isolation-trials \
    --user-data-dir=/tmp/chrome-profile \
    --remote-debugging-address=0.0.0.0 \
    --remote-debugging-port=8222 \
    --remote-allow-origins=* \
    --crash-dumps-dir=/tmp/chrome-crashes \
    --enable-logging=stderr \
    --v=1"
autostart=true
autorestart=true
stdout_logfile=/tmp/chrome.log
stderr_logfile=/tmp/chrome_err.log
environment=DISPLAY=:1
priority=20
startretries=10
startsecs=3

[program:cdpproxy]
command=python3 /app/cdp_proxy.py
autostart=true
autorestart=true
stdout_logfile=/tmp/cdpproxy.log
stderr_logfile=/tmp/cdpproxy_err.log
priority=30
startsecs=2

[program:x11vnc]
command=x11vnc -display :1 -nopw -shared -listen 0.0.0.0 -xkb -forever -rfbport 5900
autostart=true
autorestart=true
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc_err.log
environment=DISPLAY=:1
priority=40
startsecs=3

[program:websockify]
command=websockify 0.0.0.0:5901 localhost:5900
autostart=true
autorestart=true
stdout_logfile=/tmp/websockify.log
stderr_logfile=/tmp/websockify_err.log
priority=45
startsecs=3

[program:app]
command=python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080
directory=/app
autostart=true
autorestart=true
stdout_logfile=/tmp/app.log
stderr_logfile=/tmp/app_err.log
priority=50

[group:services]
programs=xvfb,chrome,cdpproxy,x11vnc,websockify,app
