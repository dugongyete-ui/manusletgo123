; ============================================================
; AI Dzeck — Master supervisord (z.ai sandbox edition)
; Adaptasi dari sandbox/replit_supervisord.conf + scripts/start_production.sh
; Path Replit (/home/runner/workspace) → /home/z/my-project
; Port backend: 3000 (satu-satunya port yang diekspos gateway z.ai)
; Catatan: x11vnc tidak tersedia di image z.ai (tanpa sudo) →
;          fitur VNC live-view dinonaktifkan; tool lain jalan via CDP.
; ============================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770

[supervisord]
logfile=/home/z/my-project/.infra/logs/supervisord.log
logfile_maxbytes=50MB
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── Virtual display untuk Chrome (1280x1029 sesuai .replit) ──
[program:xvfb]
command=bash -c "rm -f /tmp/.X1-lock && Xvfb :1 -screen 0 1280x1029x24"
autostart=true
autorestart=true
stdout_logfile=/home/z/my-project/.infra/logs/xvfb.log
stderr_logfile=/home/z/my-project/.infra/logs/xvfb_err.log
environment=DISPLAY=":1"
priority=10

; ── Chrome dengan CDP :8222 (binary Playwright — tidak ada chromium sistem)
[program:chrome]
command=bash -c " \
    CHROME=/home/z/.cache/ms-playwright/chromium-1234/chrome-linux64/chrome; \
    [ -x \"$CHROME\" ] || CHROME=$(find /home/z/.cache/ms-playwright -maxdepth 3 -type f -path '*chrome-linux*/chrome' 2>/dev/null | head -n 1); \
    [ -z \"$CHROME\" ] && { echo 'No Chrome binary found!'; exit 1; }; \
    echo \"Using browser: $CHROME\"; \
    sleep 3; \
    rm -rf /tmp/chrome-profile/SingletonLock /tmp/chrome-profile/SingletonCookie /tmp/chrome-profile/SingletonSocket; \
    exec \"$CHROME\" \
    --window-size=1280,1029 \
    --window-position=0,0 \
    --no-sandbox \
    --disable-dev-shm-usage \
    --disable-setuid-sandbox \
    --disable-accelerated-2d-canvas \
    --disable-gpu \
    --disable-software-rasterizer \
    --disable-features=WelcomeExperience,SigninPromo,VizDisplayCompositor \
    --no-first-run \
    --no-default-browser-check \
    --disable-infobars \
    --test-type \
    --disable-popup-blocking \
    --disable-gpu-sandbox \
    --no-xshm \
    --disable-notifications \
    --disable-extensions \
    --disable-component-extensions-with-background-pages \
    --disable-prompt-on-repost \
    --disable-dialogs \
    --disable-modal-dialogs \
    --disable-web-security \
    --disable-site-isolation-trials \
    --user-data-dir=/tmp/chrome-profile \
    --remote-debugging-address=0.0.0.0 \
    --remote-debugging-port=8222 \
    --remote-allow-origins=* \
    --crash-dumps-dir=/tmp/chrome-crashes \
    --enable-logging=stderr \
    --v=1"
autostart=true
autorestart=true
stdout_logfile=/home/z/my-project/.infra/logs/chrome.log
stderr_logfile=/home/z/my-project/.infra/logs/chrome_err.log
environment=DISPLAY=":1"
priority=20
startretries=10
startsecs=3

; ── Sandbox FastAPI :8080 (shell/file/supervisor API)
[program:sandbox-app]
command=python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080
directory=/home/z/my-project/sandbox
autostart=true
autorestart=true
stdout_logfile=/home/z/my-project/.infra/logs/sandbox_app.log
stderr_logfile=/home/z/my-project/.infra/logs/sandbox_app_err.log
environment=PROTECTED_PATHS="/home/z/my-project",PYTHONPATH="/home/z/my-project/sandbox"
priority=30
startsecs=3

; ── Backend FastAPI :3000 — menyajikan frontend/dist + API /api/v1
[program:backend]
command=python3 -m uvicorn app.main:app --host 0.0.0.0 --port 3000 --log-level info --no-access-log
directory=/home/z/my-project/backend
autostart=true
autorestart=true
stdout_logfile=/home/z/my-project/.infra/logs/backend.log
stderr_logfile=/home/z/my-project/.infra/logs/backend_err.log
environment=PYTHONPATH="/home/z/my-project/backend"
priority=40
startsecs=3

[group:services]
programs=xvfb,chrome,sandbox-app,backend
