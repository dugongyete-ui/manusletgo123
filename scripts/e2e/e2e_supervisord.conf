; Local E2E supervisord config — replicates Replit sandbox services
; (xvfb + chrome + websockify + sandbox FastAPI app) with locally available binaries.
;
; Portability notes:
;   * sandbox app directory is resolved relative to this file (%(HERE)s/../../sandbox)
;   * python/websockify binaries are resolved via $E2E_VENV_BIN (default: $HOME/.venv/bin)
;   * chrome binary is resolved via $CHROME_BIN, falling back to the newest
;     Playwright chromium under $HOME/.cache/ms-playwright
;   * x11vnc is not required for agent tool testing (browser tools use CDP :8222);
;     websockify on :5901 is kept only to mirror the Replit service layout.

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=bash -c "rm -f /tmp/.X1-lock && exec /usr/bin/Xvfb :1 -screen 0 1280x1029x24"
autostart=true
autorestart=true
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb_err.log
environment=DISPLAY=:1
priority=10

[program:chrome]
command=bash -c "CHROME=${CHROME_BIN:-$(ls -d $HOME/.cache/ms-playwright/chromium-*/chrome-linux64/chrome 2>/dev/null | sort -V | tail -1)}; sleep 3; rm -rf /tmp/chrome-profile/SingletonLock /tmp/chrome-profile/SingletonCookie /tmp/chrome-profile/SingletonSocket; exec \"$CHROME\" --window-size=1280,1029 --start-maximized --no-sandbox --disable-dev-shm-usage --disable-setuid-sandbox --disable-accelerated-2d-canvas --disable-gpu --disable-software-rasterizer --disable-features=WelcomeExperience,SigninPromo,VizDisplayCompositor --no-first-run --no-default-browser-check --disable-infobars --test-type --disable-popup-blocking --disable-gpu-sandbox --no-xshm --disable-notifications --disable-extensions --disable-component-extensions-with-background-pages --disable-prompt-on-repost --disable-dialogs --disable-modal-dialogs --disable-web-security --disable-site-isolation-trials --user-data-dir=/tmp/chrome-profile --remote-debugging-address=0.0.0.0 --remote-debugging-port=8222 --remote-allow-origins=* --crash-dumps-dir=/tmp/chrome-crashes --enable-logging=stderr --v=1"
autostart=true
autorestart=true
stdout_logfile=/tmp/chrome.log
stderr_logfile=/tmp/chrome_err.log
environment=DISPLAY=:1
priority=20
startretries=10
startsecs=3

[program:websockify]
command=bash -c "exec ${E2E_VENV_BIN:-$HOME/.venv/bin}/websockify 0.0.0.0:5901 localhost:5900"
autostart=true
autorestart=true
stdout_logfile=/tmp/websockify.log
stderr_logfile=/tmp/websockify_err.log
priority=45
startsecs=3

[program:app]
command=bash -c "exec ${E2E_VENV_BIN:-$HOME/.venv/bin}/python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080"
directory=%(here)s/../../sandbox
autostart=true
autorestart=true
stdout_logfile=/tmp/app.log
stderr_logfile=/tmp/app_err.log
priority=50

[program:backend]
command=bash -c "exec ${E2E_VENV_BIN:-$HOME/.venv/bin}/python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
directory=%(here)s/../../backend
autostart=true
autorestart=true
stdout_logfile=/tmp/backend_e2e.log
stderr_logfile=/tmp/backend_e2e_err.log
priority=60
startsecs=8
startretries=5
